name: forma-full
services:
  db:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: forma
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: forma
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forma -d forma"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: ./back
    environment:
      DATABASE_URL: postgres://forma:${POSTGRES_PASSWORD}@db:5432/forma?sslmode=disable
      HTTP_ADDR: 0.0.0.0:8080
      FRONTEND_ORIGIN: http://127.0.0.1:${FRONT_PORT:-3000}
      SESSION_TTL: 24h
    # Seed applies migrations and inserts missing fixtures without resetting data.
    entrypoint: ["/bin/sh", "-c"]
    command: ["api seed && exec api"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/ready"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s
  front:
    build: ./front
    ports:
      - "127.0.0.1:${FRONT_PORT:-3000}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 3s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
