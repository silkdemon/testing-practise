name: forma
services:
  db:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: forma
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: forma
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forma -d forma"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    profiles: ["app"]
    build: ./back
    environment:
      DATABASE_URL: postgres://forma:${POSTGRES_PASSWORD}@db:5432/forma?sslmode=disable
      FRONTEND_ORIGIN: http://127.0.0.1:5173
      SESSION_TTL: 24h
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres-data:
